<script type="text/plain" id="planwalk-prompt-en">You turn a floor plan image into a JSON file for the planwalk viewer. Reply with exactly one JSON object (strict JSON: no comments, no trailing commas) in one code block, with nothing before it. After the block you may add at most three short notes: where the scale came from and anything you were unsure about.

Rules
- Plan space: x to the right, y downward like the image. Put the origin at the top-left corner of the outer wall (on a cropped sheet: the top-left corner of the walls you trace).
- Every length is in metres, furniture included: use "units": "m" and give coordinates, thickness, heights, offsets and furniture sizes in metres. A 90 cm wardrobe is 0.9, never 90.
- First find the scale: use printed dimensions; else use printed room areas (m2); only as a last resort a standard door of 0.85 m. Say which one you used in meta.scale_note (at most 1000 characters), and how sure you are.
- Trace walls as centerlines of the wall strips (exterior walls kind "exterior", others "interior"). Walls that meet share exact coordinates.
- Doors: the arc is the swing; the opening is the straight chord. Windows: the triple lines in exterior walls. Passages: openings without a leaf.
- opening.offset = distance along the wall from the wall's "from" end to the near edge of the opening.
- Rooms: polygons along wall centerlines with the names printed on the plan. If an area is printed, copy it to "area" in m2 (printed areas are usually net of the walls, so your polygon may be larger, more for small rooms; that is fine, do not squeeze it). Rooms that are open to each other, with no wall between them, share an edge.
- Ids use letters, digits, "_", "-" and "." (1 to 40 characters).
- Do not invent rooms, doors or levels. If something is unreadable leave it out. Put every doubt in the JSON itself: what you left out, guessed or could not read goes in meta.notes (at most 2000 characters), and doubts about the scale go in meta.scale_note.
- Leave personal names, street addresses and phone numbers out of the JSON ("name" is a short description of the layout); room names stay as printed.
- Furniture symbols are not walls. Add furniture only when it is clearly drawn: a symbol with a closed outline that you can name with one of the types below (a bed, a sofa, a toilet). Floor patterns, hatching, tiles, text labels and decoration do not count. When in doubt, leave it out.
- Several floors: one entry in "levels" per floor with ids L0, L1, and stairs with "to_level". A drawing of one floor: stairs without "to_level" (add "rise", negative when the stair goes down from this floor), and for an upper floor set the level "elevation" (for example 3.0).

Format

```text
{
  "version": 1,
  "name": "<short name of the layout>",
  "units": "m",
  "meta": { "source": "image", "scale_note": "<how you got the scale, how sure you are>", "notes": "<what you could not read, left out or guessed>" },
  "levels": [ {
    "id": "L0",
    "walls": [ { "id": "w1", "from": [x, y], "to": [x, y], "kind": "exterior" } ],
    "openings": [ { "id": "d1", "wall": "w1", "type": "door|window|passage", "offset": 1.0, "width": 0.9 } ],
    "rooms": [ { "id": "r1", "name": "Kitchen", "polygon": [[x, y], [x, y], [x, y], [x, y]], "area": 9.5 } ]
  } ]
}
```

Optional fields: wall.thickness, wall.height (a railing or parapet, for example 1.0), opening.height, opening.sill, door hinge ("start"|"end") and opens_to ("left"|"right"), room.floor ("wood"|"tile"|"carpet"|"stone"|"concrete"), room.ceiling (false for an open balcony or terrace), level.height (only when the drawing states it), stairs [{ "id", "from", "to", "width", "steps", "to_level" (omit it when the other floor is not drawn), "rise" }], furniture [{ "id", "type", "center", "size": [width, depth], "rotation" }] with type one of bed-double, bed-single, sofa, armchair, table-dining, table-coffee, chair, desk, wardrobe, kitchen-counter, fridge, stove, sink, bathtub, shower, toilet, basin, tv-unit, bookshelf, plant, rug.
Furniture faces down the page (+y) when rotation is 0, so a piece that stands against the bottom wall of a room and must face into the room (a wardrobe, a bookshelf, a sofa facing the table above it, a chair on the lower side of a desk) needs "rotation": 180; 90 faces left and 270 faces right. A bed has its head on the left at rotation 0 (up the page at 90).</script>
<script type="text/plain" id="planwalk-prompt-pl">Zamień obraz rzutu mieszkania lub domu na plik JSON dla przeglądarki planwalk. Odpowiedz dokładnie jednym obiektem JSON (ścisły JSON: bez komentarzy i bez przecinka po ostatnim elemencie) w jednym bloku kodu, bez niczego przed nim. Pod blokiem możesz dodać najwyżej trzy krótkie uwagi po polsku: skąd wzięła się skala i w czym masz wątpliwości.

Zasady
- Układ współrzędnych: x w prawo, y w dół, jak na obrazie. Początek w lewym górnym rogu zewnętrznej ściany (na przyciętym arkuszu: w lewym górnym rogu rysowanych ścian).
- Wszystkie długości podaj w metrach, także meble: "units": "m", a współrzędne, grubości, wysokości, offset otworów i rozmiary mebli w metrach. Szafa szeroka na 90 cm to 0.9, nigdy 90.
- W pliku zawsze kropka dziesiętna: 2,50 m z rysunku zapisz jako 2.5, a 12,4 m2 jako 12.4. Klucze zostają po angielsku, tak jak w formacie poniżej.
- Najpierw ustal skalę: weź ją z podanych wymiarów (łańcuchy wymiarowe na polskich rysunkach są zwykle w centymetrach: 385 to 3,85 m); jeśli ich nie ma, z podanych powierzchni pomieszczeń (m2); dopiero na samym końcu z typowych drzwi 0,85 m. Napis skali (1:50, 1:100) jest wiarygodny tylko wtedy, gdy obraz nie był zmniejszany ani powiększany, więc sprawdź go z wymiarami albo powierzchniami. W meta.scale_note (do 1000 znaków) napisz, skąd wzięła się skala i jak bardzo jest pewna.
- Ściany prowadź po osi, czyli po środku grubego pasa ściany (zewnętrzne: kind "exterior", pozostałe: "interior"). Ściany, które się stykają, mają dokładnie te same współrzędne w punkcie styku.
- Drzwi: łuk to tor otwierania skrzydła, otwór to prosta cięciwa. Okna: potrójna linia w ścianie zewnętrznej. Przejścia: otwory bez skrzydła.
- opening.offset to odległość wzdłuż ściany od jej końca "from" do bliższej krawędzi otworu.
- Pomieszczenia: wielokąty po osiach ścian, z nazwami dokładnie takimi, jak na rysunku (zachowaj polskie litery i pisownię, na przykład Przedpokój, Spiżarnia, Jadalnia). Jeśli podano powierzchnię (na przykład "pow. 12,40 m2" albo "12,4 m²"), wpisz ją do "area" w m2 (12.4). Podane powierzchnie to zwykle powierzchnie netto, bez ścian, więc Twój wielokąt może wyjść większy, najbardziej w małych pomieszczeniach; to w porządku, nie ściskaj go. Pomieszczenia otwarte na siebie, bez ściany między nimi, mają wspólną krawędź.
- Identyfikatory (id): tylko litery angielskiego alfabetu (bez polskich znaków), cyfry, "_", "-" i "." (od 1 do 40 znaków).
- Nie wymyślaj pomieszczeń, drzwi ani kondygnacji. To, czego nie da się odczytać, pomiń. Każdą wątpliwość wpisz do samego pliku: co pominięto, co jest domysłem albo było nieczytelne, w meta.notes (do 2000 znaków, po polsku), a wątpliwości co do skali w meta.scale_note.
- Nie przepisuj do pliku imion i nazwisk, adresów ani numerów telefonu z arkusza ("name" to krótki opis układu, na przykład "Mieszkanie trzypokojowe"); nazwy pomieszczeń zostają takie, jak na rysunku.
- Meble to nie ściany. Dodawaj meble tylko wtedy, gdy są wyraźnie narysowane: symbol z zamkniętym obrysem, który potrafisz nazwać jednym z typów z listy poniżej (łóżko, sofa, sedes). Wzory podłogi, kreskowanie, płytki, napisy i ozdoby się nie liczą. W razie wątpliwości pomiń.
- Kilka kondygnacji: jeden wpis w "levels" na kondygnację, z id L0, L1, a wpisy w "stairs" z "to_level". Rysunek jednej kondygnacji: wpisy w "stairs" bez "to_level" (dodaj "rise", ujemne, gdy prowadzą w dół z tej kondygnacji), a dla piętra ustaw "elevation" kondygnacji (na przykład 3.0).

Polskie rysunki
- Rzut z prospektu informacyjnego dewelopera albo karty lokalu: pomieszczenia mają na rysunku tylko numery (1, 2, 3), a nazwy i powierzchnie (kolumna "pow.") stoją w osobnej tabeli. Dopasuj numer z rysunku do wiersza tabeli: nazwę z tabeli wpisz do "name", powierzchnię do "area" (przecinek zamień na kropkę). Gdy nie masz pewności, który wiersz pasuje do którego pomieszczenia, pomiń "area", jako "name" wpisz numer z rysunku i napisz o tym w meta.notes. Wiersz z sumą ("powierzchnia użytkowa", "powierzchnia całkowita", "razem") nie jest pomieszczeniem.
- Balkon i taras zapisz jako osobne pomieszczenia, jeśli są narysowane, z "ceiling": false; balustradę jako cienką ścianę zewnętrzną z "height": 1.0 i "thickness": 0.1. Garderoba, WC, przedpokój to zwykłe pomieszczenia z nazwą jak na rysunku. Klatka schodowa za drzwiami wejściowymi mieszkania nie jest częścią lokalu: nie dodawaj jej jako pomieszczenia. Biegi schodowe wewnątrz domu zapisz w "stairs".
- Wysokość pomieszczeń na polskich rysunkach to zwykle od 2,50 do 2,70 m; podaj level.height tylko wtedy, gdy jest na rysunku lub w opisie, inaczej go pomiń (domyślnie 2.7).

Format

```text
{
  "version": 1,
  "name": "<krótka nazwa układu>",
  "units": "m",
  "meta": { "source": "image", "scale_note": "<skąd skala i jak bardzo jest pewna>", "notes": "<czego nie dało się odczytać, co pominięto lub jest domysłem>" },
  "levels": [ {
    "id": "L0",
    "walls": [ { "id": "w1", "from": [x, y], "to": [x, y], "kind": "exterior" } ],
    "openings": [ { "id": "d1", "wall": "w1", "type": "door|window|passage", "offset": 1.0, "width": 0.9 } ],
    "rooms": [ { "id": "r1", "name": "Jadalnia", "polygon": [[x, y], [x, y], [x, y], [x, y]], "area": 9.5 } ]
  } ]
}
```

Pola opcjonalne: wall.thickness, wall.height (balustrada lub attyka, na przykład 1.0), opening.height, opening.sill, hinge drzwi ("start"|"end") i opens_to ("left"|"right"), room.floor ("wood"|"tile"|"carpet"|"stone"|"concrete"), room.ceiling (false dla otwartego balkonu lub tarasu), level.height (tylko gdy podana na rysunku), stairs [{ "id", "from", "to", "width", "steps", "to_level" (pomiń, gdy druga kondygnacja nie jest narysowana), "rise" }], furniture [{ "id", "type", "center", "size": [szerokość, głębokość], "rotation" }] z typem jednym z: bed-double, bed-single, sofa, armchair, table-dining, table-coffee, chair, desk, wardrobe, kitchen-counter, fridge, stove, sink, bathtub, shower, toilet, basin, tv-unit, bookshelf, plant, rug.
Mebel jest zwrócony ku dołowi rysunku (+y), gdy rotation wynosi 0. Mebel, który stoi przy dolnej ścianie pomieszczenia i ma być zwrócony do wnętrza (szafa, regał, sofa zwrócona do stołu położonego wyżej, krzesło po dolnej stronie biurka), wymaga "rotation": 180; 90 zwraca go w lewo, a 270 w prawo. Łóżko ma wezgłowie po lewej przy rotation 0 (ku górze rysunku przy 90).</script>

html,body{margin:0;height:100%;overflow:hidden;background:#dfe6ee;font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#37332d}
#pw-app{position:fixed;inset:0}
#pw-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.pw-bar{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;padding:5px 8px;font-size:12px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border:1px solid rgba(80,72,62,.15);border-radius:10px;box-shadow:0 2px 10px rgba(60,50,40,.08)}
.pw-brand{font-weight:700;letter-spacing:.2px;margin-right:4px}
.pw-name{color:#7a7266;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-seg{display:flex;border:1px solid rgba(80,72,62,.25);border-radius:7px;overflow:hidden}
.pw-bar button,.pw-bar select,.pw-card button,.pw-dlg button{font:inherit;color:inherit;background:#fbfaf7;border:1px solid rgba(80,72,62,.25);border-radius:7px;padding:3px 8px;cursor:pointer}
.pw-seg button{border:0;border-radius:0;border-right:1px solid rgba(80,72,62,.2)}
.pw-seg button:last-child{border-right:0}
.pw-bar button:hover,.pw-card button:hover,.pw-dlg button:hover{background:#f0ece3}
.pw-bar button.on{background:#37332d;color:#fff}
.pw-bar button:disabled,.pw-bar select:disabled,.pw-bar input:disabled{opacity:.4;cursor:default}
.pw-bar label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.pw-spacer{flex:1}
.pw-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(440px,86vw);padding:18px 20px;text-align:center;background:rgba(255,255,255,.9);border:1px dashed rgba(80,72,62,.4);border-radius:14px}
.pw-card p{margin:0 0 10px}
.pw-card button{margin:3px}
.pw-issues{position:absolute;left:10px;bottom:10px;width:min(560px,92vw);max-height:42vh;overflow:auto;background:rgba(255,255,255,.93);border:1px solid rgba(80,72,62,.2);border-radius:10px;padding:8px 10px;box-shadow:0 2px 10px rgba(60,50,40,.1)}
.pw-issues h3{margin:0 0 6px;font-size:13px;display:flex;gap:8px;align-items:center}
.pw-issues ul{margin:0;padding:0;list-style:none}
.pw-issues li{padding:4px 0;border-top:1px solid rgba(80,72,62,.12)}
.pw-issues .e{color:#b3321f;font-weight:600}.pw-issues .w{color:#9a6a12;font-weight:600}
.pw-issues em{display:block;color:#6a6358;font-style:normal}
.pw-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:5px 12px;background:rgba(40,36,30,.72);color:#fff;border-radius:999px;pointer-events:none}
.pw-mini{position:absolute;right:12px;bottom:12px;width:180px;height:180px;border:1px solid rgba(80,72,62,.3);border-radius:10px;background:rgba(255,255,255,.82)}
.pw-dlg{border:1px solid rgba(80,72,62,.3);border-radius:12px;padding:14px 16px;max-width:min(560px,92vw);color:#37332d}
.pw-dlg::backdrop{background:rgba(40,36,30,.35)}
.pw-dlg textarea{width:min(520px,80vw);height:260px;font:12px ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box}
.pw-dlg h2{margin:0 0 8px;font-size:15px}.pw-dlg li{margin:4px 0}
[hidden]{display:none!important}
