name: release
# Runs when a tag like v0.1.1 is pushed. Steps to cut a release are in CONTRIBUTING.md ("Releasing").
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the build provenance attestation
      attestations: write
    env:
      PLANWALK_REQUIRE_CHROME: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: The tag matches the version in package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      # recent runner images restrict unprivileged user namespaces, which keeps Chrome's sandbox from starting
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci
      - run: npm run build:skill
      - name: Built viewer and generated skill files are committed and up to date
        run: |
          git status --porcelain dist/ skill/
          test -z "$(git status --porcelain dist/ skill/)"
      - run: npm test
      - name: Collect the release files
        run: |
          mkdir release
          cp dist/planwalk.html release/planwalk.html
          (cd release && sha256sum planwalk.html > planwalk.html.sha256 && cat planwalk.html.sha256)
          node tools/changelog-section.mjs "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md
      - name: Build provenance attestation for planwalk.html
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/planwalk.html
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/planwalk.html release/planwalk.html.sha256 --verify-tag --title "planwalk ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
